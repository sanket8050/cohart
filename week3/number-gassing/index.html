<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Number Guessing Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 400px;
      margin: 40px auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin-bottom: 1rem;
      color: #007bff;
    }
    .input-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      width: 100%;
      justify-content: center;
    }
    #guessField {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
      width: 120px;
      text-align: center;
    }
    #subt {
      padding: 0.5rem 1.5rem;
      border-radius: 8px;
      border: none;
      background: #007bff;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    #subt:hover {
      background: #0056b3;
    }
    .guesses, .lastResult, .lowOrHi {
      margin: 0.5rem 0;
      font-size: 1.1rem;
    }
    .lowOrHi h2 {
      margin: 0.5rem 0 0 0;
      color: #d9534f;
      font-size: 1.2rem;
    }
    .resultParas {
      margin-top: 1rem;
      text-align: center;
    }
    .button h2 {
      color: #28a745;
      cursor: pointer;
      margin: 1rem 0 0 0;
      font-size: 1.2rem;
      transition: color 0.2s;
    }
    .button h2:hover {
      color: #218838;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Number Guessing Game</h1>
    <p>Guess a number between 1 and 100.</p>
    <div class="input-group">
      <input type="number" id="guessField" placeholder="Enter your guess" min="1" max="100" autocomplete="off">
      <button id="subt">Guess</button>
    </div>
    <div><strong>Your guesses:</strong> <span class="guesses"></span></div>
    <div><strong>Guesses left:</strong> <span class="lastResult"></span></div>
    <div class="lowOrHi"></div>
    <div class="resultParas"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
